name: Forex 24/7 Bot

on:
  schedule:
    - cron: '*/5 * * * 1-5' # اجرا هر ۵ دقیقه (دوشنبه تا جمعه - روزهای کاری بازار)
  workflow_dispatch: # دکمه اجرای دستی

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # اجازه نوشتن ژورنال در مخزن

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Save Journal (Commit changes)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add journal.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update trading journal" && git push)
